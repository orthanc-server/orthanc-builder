services:
  orthanc-under-tests:
    image: orthanc-under-tests
    volumes:
      - wl-volume:/worklists
    environment:
      VERBOSE_STARTUP: true
      VERBOSE_ENABLED: true
      ORTHANC__WORKLISTS: |
        {
          "FilterIssuerAet": false,
          "HousekeepingInterval": 1
        }

  orthanc-tests-worklists:
    image: orthanc-tests-worklists
    depends_on:
      - orthanc-under-tests
    volumes:
      - wl-volume:/tests/orthanc-tests//Database/Worklists/Working
volumes:
  wl-volume:

